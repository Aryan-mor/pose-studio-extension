name: Release extension

# Push a tag like v3.0.1 (or run manually) to build the extension and attach a ready-to-install zip.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set manifest version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const f='extension/manifest.json',m=JSON.parse(require('fs').readFileSync(f));m.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(m,null,2)+'\n')" "$VERSION"

      - name: Build
        run: pnpm build
        env:
          RELEASE: '1'

      - name: Zip
        run: |
          NAME="pose-studio-extension-${GITHUB_REF_NAME}"
          mv extension-dist "$NAME"
          zip -qr "$NAME.zip" "$NAME"
          echo "ZIP=$NAME.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: pose-studio-extension
          path: ${{ env.ZIP }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
