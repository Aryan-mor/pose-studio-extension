<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Pose Studio for Gemini, ChatGPT and Grok: portrait plus costume plus pose equals your result">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f14"/>
      <stop offset="1" stop-color="#2a1a5e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="resultFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a7a"/>
      <stop offset="1" stop-color="#1f1d2b"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <path id="spark" d="M0 -14 L3.5 -3.5 L14 0 L3.5 3.5 L0 14 L-3.5 3.5 L-14 0 L-3.5 -3.5 Z"/>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#dots)"/>
  <circle cx="1180" cy="40" r="220" fill="#8b5cf6" opacity="0.10"/>

  <!-- logo -->
  <rect x="80" y="56" width="80" height="80" rx="20" fill="url(#accent)"/>
  <circle cx="120" cy="80" r="9" fill="#fff"/>
  <path d="M110 92 H130 L134 112 H106 Z" fill="#fff"/>
  <rect x="109" y="112" width="7" height="12" rx="3" fill="#fff"/>
  <rect x="124" y="112" width="7" height="12" rx="3" fill="#fff"/>

  <!-- title -->
  <g font-family="'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif">
    <text x="80" y="214" font-size="66" font-weight="800" fill="#ffffff">Pose Studio</text>
    <text x="80" y="262" font-size="27" font-weight="600" fill="#a78bfa">for Gemini · ChatGPT · Grok</text>
    <text x="80" y="309" font-size="20" fill="#b9b6d3">Pick a portrait, a costume and a pose.</text>
    <text x="80" y="337" font-size="20" fill="#b9b6d3">Send them to your AI chat in one click.</text>

    <!-- pills -->
    <rect x="80" y="366" width="178" height="34" rx="17" fill="#ffffff" opacity="0.10"/>
    <text x="169" y="388" font-size="15" font-weight="600" fill="#e9e5ff" text-anchor="middle">Chrome extension</text>
    <rect x="270" y="366" width="190" height="34" rx="17" fill="#ffffff" opacity="0.10"/>
    <text x="365" y="388" font-size="15" font-weight="600" fill="#e9e5ff" text-anchor="middle">4,300+ references</text>
  </g>

  <!-- portrait + costume + pose = result -->
  <g transform="translate(0,20)" font-family="'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif">
    <!-- cards -->
    <rect x="680" y="130" width="110" height="170" rx="16" fill="#1f1d2b" stroke="#3b3560" stroke-width="2"/>
    <rect x="830" y="130" width="110" height="170" rx="16" fill="#1f1d2b" stroke="#3b3560" stroke-width="2"/>
    <rect x="980" y="130" width="110" height="170" rx="16" fill="#1f1d2b" stroke="#3b3560" stroke-width="2"/>
    <rect x="1130" y="130" width="110" height="170" rx="16" fill="url(#resultFill)" stroke="#8b5cf6" stroke-width="3"/>

    <!-- portrait icon -->
    <circle cx="735" cy="190" r="24" fill="#c4b5fd"/>
    <path d="M696 262 Q735 214 774 262 Z" fill="#8b5cf6"/>

    <!-- costume icon (dress) -->
    <path d="M872 160 L898 160 L909 196 L924 262 L846 262 L861 196 Z" fill="#c4b5fd"/>
    <path d="M872 160 Q885 176 898 160" fill="none" stroke="#1f1d2b" stroke-width="3"/>
    <rect x="862" y="198" width="46" height="6" fill="#8b5cf6"/>

    <!-- pose icon (figure) -->
    <g stroke="#c4b5fd" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="1035" y1="180" x2="1035" y2="226"/>
      <line x1="1035" y1="194" x2="1010" y2="214"/>
      <line x1="1035" y1="194" x2="1062" y2="176"/>
      <line x1="1035" y1="226" x2="1020" y2="262"/>
      <line x1="1035" y1="226" x2="1054" y2="258"/>
    </g>
    <circle cx="1035" cy="166" r="14" fill="#c4b5fd"/>

    <!-- result icon: the figure wearing the dress, with sparkles -->
    <circle cx="1185" cy="168" r="15" fill="#ffffff"/>
    <path d="M1172 184 L1198 184 L1209 214 L1224 262 L1146 262 L1161 214 Z" fill="url(#accent)"/>
    <use href="#spark" x="1150" y="158" fill="#fde68a"/>
    <use href="#spark" x="1222" y="190" fill="#ffffff" transform="translate(1222 190) scale(0.7) translate(-1222 -190)"/>
    <use href="#spark" x="1224" y="150" fill="#fde68a" transform="translate(1224 150) scale(0.55) translate(-1224 -150)"/>

    <!-- labels -->
    <g font-size="15" font-weight="600" text-anchor="middle" fill="#a5a3c4">
      <text x="735" y="288">Portrait</text>
      <text x="885" y="288">Costume</text>
      <text x="1035" y="288">Pose</text>
      <text x="1185" y="288" fill="#ddd6fe">Result</text>
    </g>

    <!-- operators -->
    <g font-size="34" font-weight="700" text-anchor="middle" fill="#a78bfa">
      <text x="810" y="228">+</text>
      <text x="960" y="228">+</text>
      <text x="1110" y="228">=</text>
    </g>
  </g>
</svg>
